name: Release

# Une release par push sur main, mais seulement si la CI est verte : une version
# publiée est une version testée. D'où le déclenchement sur la fin de la CI
# plutôt que sur le push lui-même.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false   # ne jamais interrompre une publication en cours

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    timeout-minutes: 30
    # Rien n'est publié si la CI a échoué.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          # Le commit exactement validé par la CI, pas la tête de branche, qui a
          # pu bouger entre-temps.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0   # le numéro de version dérive du nombre de commits

      # Majeur et mineur viennent du fichier VERSION, sous contrôle de l'auteur ;
      # le patch est le nombre de commits, donc déterministe pour un commit donné,
      # unique et toujours croissant. Les versions restent sémantiques, ce dont
      # dépend le vérificateur de mise à jour intégré à l'app.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          BASE=$(tr -d '[:space:]' < VERSION)
          PATCH=$(git rev-list --count HEAD)
          VERSION="${BASE}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # Un commit déjà publié ne l'est pas deux fois : une réexécution de la CI
      # ne doit pas produire de doublon.
      - name: Skip if already released
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} déjà publiée — rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app bundle
        if: steps.guard.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: ./Scripts/build-app.sh

      - name: Package
        if: steps.guard.outputs.skip == 'false'
        id: package
        run: |
          set -euo pipefail
          cd build
          ARCHIVE="LogicCheckVoicePresence-${{ steps.version.outputs.tag }}.zip"
          # ditto préserve les métadonnées du bundle et sa signature, ce que zip
          # ne fait pas correctement pour une app macOS.
          ditto -c -k --sequesterRsrc --keepParent LogicCheckVoicePresence.app "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=build/$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=build/$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$ARCHIVE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Verify the bundle
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          APP="build/LogicCheckVoicePresence.app"
          test -x "$APP/Contents/MacOS/LogicCheckVoicePresence"
          plutil -lint "$APP/Contents/Info.plist"
          ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [ "$ACTUAL" != "${{ steps.version.outputs.version }}" ]; then
            echo "Version du bundle ($ACTUAL) différente de la version publiée" >&2
            exit 1
          fi
          codesign --verify --verbose "$APP" || echo "signature ad hoc uniquement"

      # `gh release create` crée le tag sur le commit visé : aucun tag n'a besoin
      # d'être poussé depuis l'extérieur.
      - name: Publish release
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          {
            echo "## Installation"
            echo
            echo "1. Téléchargez \`${{ steps.package.outputs.name }}\` et décompressez-le."
            echo "2. Glissez **LogicCheckVoicePresence.app** dans *Applications*."
            echo "3. Au premier lancement : **clic droit sur l'app → Ouvrir**, puis confirmez."
            echo "   L'app n'est pas notarisée, macOS demande donc une confirmation"
            echo "   explicite la première fois."
            echo
            echo "## Vérifier l'archive"
            echo
            echo '```'
            echo "shasum -a 256 ${{ steps.package.outputs.name }}"
            echo "${{ steps.package.outputs.sha }}"
            echo '```'
            echo
            echo "## Configuration requise"
            echo
            echo "macOS 14 (Sonoma) ou plus récent."
          } > "$NOTES"

          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "$NOTES" \
            --generate-notes \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}"
