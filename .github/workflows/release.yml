name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire : le numéro de build est le compte de commits

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # La release ne part pas si les tests échouent : une version publiée est
      # une version testée.
      - name: Test
        run: swift test

      - name: Build app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: ./Scripts/build-app.sh

      - name: Package
        id: package
        run: |
          set -euo pipefail
          cd build
          ARCHIVE="LogicCheckVoicePresence-${{ steps.version.outputs.tag }}.zip"
          # ditto préserve les métadonnées du bundle et la signature, ce que zip
          # ne fait pas correctement pour une app macOS.
          ditto -c -k --sequesterRsrc --keepParent LogicCheckVoicePresence.app "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=build/$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=build/$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$ARCHIVE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify the bundle launches as an app
        run: |
          set -euo pipefail
          APP="build/LogicCheckVoicePresence.app"
          test -x "$APP/Contents/MacOS/LogicCheckVoicePresence"
          plutil -lint "$APP/Contents/Info.plist"
          ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [ "$ACTUAL" != "${{ steps.version.outputs.version }}" ]; then
            echo "Version du bundle ($ACTUAL) différente du tag (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi
          codesign --verify --verbose "$APP" || echo "⚠︎ signature ad hoc uniquement"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          {
            echo "## Installation"
            echo
            echo "1. Télécharge \`$(basename '${{ steps.package.outputs.archive }}')\` et décompresse-le."
            echo "2. Déplace **LogicCheckVoicePresence.app** dans *Applications*."
            echo "3. Au premier lancement : **clic droit sur l'app → Ouvrir**, puis confirme."
            echo "   L'app est signée ad hoc, pas notarisée — macOS demande donc une"
            echo "   confirmation explicite la première fois."
            echo
            echo "## Vérification de l'archive"
            echo
            echo '```'
            echo "shasum -a 256 $(basename '${{ steps.package.outputs.archive }}')"
            echo "${{ steps.package.outputs.sha }}"
            echo '```'
            echo
            echo "## Configuration requise"
            echo
            echo "macOS 14 (Sonoma) ou plus récent."
          } > "$NOTES"

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "$NOTES" \
            --generate-notes \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}"
